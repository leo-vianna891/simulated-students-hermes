training:
  seed: 42
  epochs: 3
  learning_rate: 5.0e-5
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  scheduler: linear
  warmup_ratio: 0.1
  effective_batch_size: 64
  precision: bf16
  checkpoint_steps: 5

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset: Eedi/Question-Anchored-Tutoring-Dialogues-2k
  source_repo: umass-ml4ed/sim-student-eval
  revision: 4c94a33e6053fd7acf812ff122deab16dcd3c126
  annotation_model: gpt-4.1
  maximum_prompt_characters: 6000
  filter_tokenizer_id: meta-llama/Llama-3.2-3B-Instruct
  filter_tokenizer_revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95

