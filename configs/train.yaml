training:
  seed: 42
  epochs: 3
  learning_rate: 5.0e-5
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  scheduler: linear
  warmup_ratio: 0.1
  effective_batch_size: 64
  precision: bf16

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset: Eedi/Question-Anchored-Tutoring-Dialogues-2k
  split_seed: 221
  train_fraction: 0.75
  maximum_prompt_characters: 6000
  filter_tokenizer_id: meta-llama/Llama-3.2-3B-Instruct
  filter_tokenizer_revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95

models:
  llama_3_2_3b:
    id: meta-llama/Llama-3.2-3B-Instruct
    train_batch_size: 2
    validation_batch_size: 4
    gradient_accumulation_steps: 32
  llama_3_1_8b:
    id: meta-llama/Llama-3.1-8B-Instruct
    validation_batch_size: 4
    train_batch_size: 1
    gradient_accumulation_steps: 64
  qwen3_4b:
    id: Qwen/Qwen3-4B-Instruct-2507
    validation_batch_size: 4
    train_batch_size: null
    gradient_accumulation_steps: null
