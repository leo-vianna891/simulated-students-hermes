schema_version: 1
experiment:
  name: paper-faithful-sft
  treatment: student_only_lora
  precision: bf16
  epochs: 3
  learning_rate: 5.0e-5
  weight_decay: 1.0e-2
  max_grad_norm: 1.0
  scheduler: linear
  warmup_ratio: 0.1
  effective_batch_size: 64
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  use_rslora: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  maximum_formatted_prompt_characters: 6000
  split_seed: 221
  train_fraction_of_original_train: 0.75

models:
  llama_3_2_3b:
    id: meta-llama/Llama-3.2-3B-Instruct
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 32
    per_device_eval_batch_size: 4
  llama_3_1_8b:
    id: meta-llama/Llama-3.1-8B-Instruct
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 64
    per_device_eval_batch_size: 2
  qwen3_4b:
    id: Qwen/Qwen3-4B-Instruct-2507
    per_device_train_batch_size: null
    gradient_accumulation_steps: null
    per_device_eval_batch_size: null
    note: Select values through a documented memory pilot while preserving effective batch size 64.
